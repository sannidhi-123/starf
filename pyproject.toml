[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stark"
version = "0.1.0"
description = "Hybrid Anomaly Detection for Intra-Vehicular CAN-Bus Communication"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
]

[tool.setuptools.packages.find]
where = ["src"]

