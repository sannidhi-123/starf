services:
  backend:
    build: ./backend
    environment:
      APP_NAME: STARK API
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:///./data/stark.db
      INTEGRATION_MODE: mock
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
